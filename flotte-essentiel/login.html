<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flotte Essentiel - Connexion</title>
<style>
:root{--navy:#0D2940;--blue:#0F4C75;--gray:#5E6B6F;--lgray:#F4F6F7;--green:#198754;--red:#C82333;--orange:#FF8C00;--gold:#DAA520}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0D2940 0%,#0F4C75 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-box{background:#fff;border-radius:14px;max-width:380px;width:100%;padding:32px 24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.logo{text-align:center;font-size:48px;margin-bottom:8px}
.title{text-align:center;font-size:20px;font-weight:700;color:var(--navy);margin-bottom:2px}
.subtitle{text-align:center;font-size:12px;color:var(--gray);margin-bottom:24px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:4px}
.form-group input{width:100%;padding:11px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px}
.form-group input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(15,76,117,.1)}
.btn-login{width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-login:hover{background:var(--blue)}
.error{color:var(--red);font-size:12px;text-align:center;padding:8px;border-radius:6px;background:#FFEBEE;margin-bottom:12px;display:none}
.footer{text-align:center;font-size:10px;color:var(--gray);margin-top:20px}
.role-hint{text-align:center;font-size:11px;color:var(--gray);margin-top:16px;padding:10px;background:var(--lgray);border-radius:8px}
</style>
</head>
<body>
<div class="login-box">
<div class="logo">🚛</div>
<div class="title">Flotte Essentiel</div>
<div class="subtitle" id="clientName">Gestion de Flotte Poids Lourds</div>
<div class="error" id="errBox"></div>
<div class="form-group">
<label>Nom d'utilisateur</label>
<input type="text" id="username" placeholder="admin" autocomplete="username">
</div>
<div class="form-group">
<label>Mot de passe</label>
<input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
</div>
<button class="btn-login" onclick="doLogin()">Se connecter</button>
<div class="role-hint">
<b>Comptes de test:</b><br>
admin / admin123 (Directeur)<br>
manager / manager123 (Manager)<br>
chauffeur / driver123 (Chauffeur)
</div>
<div class="footer">Flotte Essentiel v1.0 - Formule 1 (1500 TND)</div>
</div>

<script>
var API_URL = 'api/index.php';

document.getElementById('password').addEventListener('keypress', function(e) {
if (e.key === 'Enter') doLogin();
});

// Verifier le statut d'installation
fetch(API_URL + '?action=status')
.then(function(r){return r.json();})
.then(function(d){
if (d.client) {
document.getElementById('clientName').textContent = d.client + ' - Gestion de Flotte';
}
if (!d.installed) {
document.getElementById('errBox').textContent = 'Systeme non installe. Contactez l\'administrateur.';
document.getElementById('errBox').style.display = 'block';
}
})
.catch(function(){});

// Verifier si deja connecte
fetch(API_URL + '?action=me')
.then(function(r){return r.json();})
.then(function(d){
if (d.user) {
window.location.href = 'app.html';
}
})
.catch(function(){});

function doLogin() {
var u = document.getElementById('username').value.trim();
var p = document.getElementById('password').value;
if (!u || !p) {
document.getElementById('errBox').textContent = 'Veuillez remplir tous les champs';
document.getElementById('errBox').style.display = 'block';
return;
}

fetch(API_URL + '?action=login', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({username: u, password: p})
})
.then(function(r){return r.json();})
.then(function(d){
if (d.success) {
window.location.href = 'app.html';
} else {
document.getElementById('errBox').textContent = d.error || 'Erreur de connexion';
document.getElementById('errBox').style.display = 'block';
}
})
.catch(function(){
document.getElementById('errBox').textContent = 'Erreur de connexion au serveur';
document.getElementById('errBox').style.display = 'block';
});
}
</script>
</body>
</html>
