<!DOCTYPE html>

<style>
:root{--navy:#0A1628;--gold:#B89414;--blue:#1A55B8;--green:#275E32;--red:#C62828;--orange:#E65100;--lgray:#F5F5F5;--gray:#757575;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--lgray);color:#333;font-size:14px}

.nav button:hover{background:var(--lgray)}

.container{max-width:1000px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px;overflow:hidden}
.card-header{padding:10px 14px;border-bottom:1px solid #eee;font-weight:600;color:var(--navy)}
.card-body{padding:14px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-weight:500;margin-bottom:3px;font-size:12px;color:#444}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--blue)}

// ============================================
// DATABASE - Simple localStorage with version key
// ============================================
var DB_KEY = 'fleet_db_final_v2';

// Fallback memoire si localStorage est bloque (ex: ouverture fichier local file:// sur certains navigateurs mobiles)
var MEMORY_DB = null;
var STORAGE_OK = true;
try {
  var testKey = '__fleet_test__';
  localStorage.setItem(testKey, '1');
  localStorage.removeItem(testKey);
} catch(e) {
  STORAGE_OK = false;
}

function loadDB() {
  if (!STORAGE_OK) {
    return MEMORY_DB || newDB();
  }
  try {
    var raw = localStorage.getItem(DB_KEY);
    if (!raw) return newDB();
    return JSON.parse(raw);
  } catch(e) {
    console.error('DB load error', e);
    STORAGE_OK = false;
    return MEMORY_DB || newDB();
  }
}

function saveDB(db) {
  if (!STORAGE_OK) {
    MEMORY_DB = db;
    return;
  }
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  } catch(e) {
    console.error('DB save error', e);
    STORAGE_OK = false;
    MEMORY_DB = db;
  }
}

function newDB() {
  return { trucks: [], statusHistory: [], filterChanges: [], oilChanges: [], fuel: [], mileage: [] };
}

// ============================================
// HELPER FUNCTIONS
// ============================================
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function daysBetween(d) { if (!d) return 0; return Math.floor((new Date() - new Date(d)) / 86400000); }

function getLatestKm(ref) {
  var db = loadDB();
  var truck = db.trucks.find(function(t) { return t.ref === ref; });
  var max = truck ? (truck.kmInit || 0) : 0;
  db.mileage.forEach(function(m) { if (m.truckRef === ref && (m.kmEnd || 0) > max) max = m.kmEnd; });
  db.fuel.forEach(function(f) { if (f.truckRef === ref && (f.km || 0) > max) max = f.km; });
  db.oilChanges.forEach(function(o) { if (o.truckRef === ref && (o.km || 0) > max) max = o.km; });
  return max;
}

function getKmAtLastOilChange(ref) {
  var db = loadDB();
  var oils = db.oilChanges.filter(function(o) { return o.truckRef === ref; })
    .sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
  return oils.length > 0 ? (oils[0].km || 0) : 0;
}

function getKmAtLastFilter(ref, fType) {
  var db = loadDB();
  var filters = db.filterChanges.filter(function(f) { return f.truckRef === ref && f.filterType === fType; })
    .sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
  if (filters.length === 0) return 0;
  var date = filters[0].date;
  var km = 0;
  db.fuel.forEach(function(f) { if (f.truckRef === ref && f.date <= date && f.km > km) km = f.km; });
  db.mileage.forEach(function(m) { if (m.truckRef === ref && (m.month || '').substr(0,7) <= (date || '').substr(0,7) && (m.kmEnd || 0) > km) km = m.kmEnd; });
  return km;
}

function checkAlert(truck) {
  var currentKm = getLatestKm(truck.ref);
  var lastOilKm = getKmAtLastOilChange(truck.ref);
  var kmSinceOil = currentKm - lastOilKm;
  var seuilV = truck.seuilVidange || 30000;
  var seuilA = truck.seuilAir || 40000;
  var seuilH = truck.seuilHuile || 30000;
  
  var alerts = [];
  
  // Vidange
  if (lastOilKm > 0) {
    if (kmSinceOil >= seuilV) alerts.push({level:'crit', msg:'VIDANGE DEPASSEE: ' + kmSinceOil.toLocaleString() + ' km / ' + seuilV.toLocaleString() + ' km'});
    else if (kmSinceOil >= seuilV * 0.8) alerts.push({level:'warn', msg:'Vidange bientot: ' + kmSinceOil.toLocaleString() + ' / ' + seuilV.toLocaleString() + ' km (' + Math.round(kmSinceOil/seuilV*100) + '%)'});
  } else {
    var kmInit = truck.kmInit || 0;
    var kmSinceInit = currentKm - kmInit;
    if (kmSinceInit >= seuilV) alerts.push({level:'crit', msg:'VIDANGE JAMAIS FAITE! ' + kmSinceInit.toLocaleString() + ' km (seuil: ' + seuilV.toLocaleString() + ' km)'});
    else if (kmSinceInit >= seuilV * 0.8) alerts.push({level:'warn', msg:'Premiere vidange a prevoir: ' + kmSinceInit.toLocaleString() + ' / ' + seuilV.toLocaleString() + ' km'});
  }
  
  // Filtre air
  var lastAirKm = getKmAtLastFilter(truck.ref, 'Filtre Air');
  var kmSinceAir = currentKm - lastAirKm;
  if (lastAirKm > 0) {
    if (kmSinceAir >= seuilA) alerts.push({level:'crit', msg:'FILTRE AIR DEPASSE: ' + kmSinceAir.toLocaleString() + ' km / ' + seuilA.toLocaleString() + ' km'});
    else if (kmSinceAir >= seuilA * 0.8) alerts.push({level:'warn', msg:'Filtre air bientot: ' + kmSinceAir.toLocaleString() + ' / ' + seuilA.toLocaleString() + ' km (' + Math.round(kmSinceAir/seuilA*100) + '%)'});
  }
  
  // Filtre huile
  var lastFHuileKm = getKmAtLastFilter(truck.ref, 'Filtre Huile');
  var kmSinceFH = currentKm - lastFHuileKm;
  if (lastFHuileKm > 0) {
    if (kmSinceFH >= seuilH) alerts.push({level:'crit', msg:'FILTRE HUILE DEPASSE: ' + kmSinceFH.toLocaleString() + ' km / ' + seuilH.toLocaleString() + ' km'});
    else if (kmSinceFH >= seuilH * 0.8) alerts.push({level:'warn', msg:'Filtre huile bientot: ' + kmSinceFH.toLocaleString() + ' / ' + seuilH.toLocaleString() + ' km (' + Math.round(kmSinceFH/seuilH*100) + '%)'});
  }
  
  return alerts.length > 0 ? alerts[0] : null;
}

function loadCurrentStatus() {
  var ref = val('statusTruck');
  var db = loadDB();
  var t = db.trucks.find(function(x){return x.ref===ref;});
  var info = document.getElementById('currentStatusInfo');
  if (!t) { info.style.display = 'none'; return; }
  info.style.display = 'block';
  var d = daysBetween(t.statusDate);
  info.innerHTML = '<div class="info-box">Statut actuel: <b>'+t.statut+'</b>'+(t.statusDate?' depuis le '+t.statusDate+' ('+d+' jour(s))':'')+(t.statusReason?'<br>Motif: '+t.statusReason:'')+'</div>';
}

function saveStatus() {
  var db = loadDB();
  var ref = val('statusTruck');
  var newSt = val('newStatus');
  var date = val('statusTruck') ? val('statusDate') : '';
  var reason = val('statusReason');
  
  if (!ref) { alert('Choisir un camion!'); return; }
  if (!date) { alert('Date obligatoire!'); return; }
  
  var idx = db.trucks.findIndex(function(x){return x.ref===ref;});
  if (idx === -1) { alert('Camion introuvable!'); return; }
  
  var oldStatus = db.trucks[idx].statut || 'Actif';
  
  // Si remise en Actif, calculer duree
  var prev = db.statusHistory.filter(function(s){return s.truckRef===ref && s.newStatus!=='Actif' && !s.durationDays;}).pop();
  if (prev && newSt === 'Actif') {
    prev.dateRetour = date;
    prev.durationDays = daysBetween(prev.date);
  }
  
  // Historique
  db.statusHistory.push({
    truckRef: ref, oldStatus: oldStatus, newStatus: newSt,
    date: date, dateRetour: newSt === 'Actif' ? date : '',
    durationDays: newSt === 'Actif' && prev ? prev.durationDays : 0,
    reason: reason
  });
  
  // MAJ camion PAR INDEX
  db.trucks[idx].statut = newSt;
  db.trucks[idx].statusDate = (newSt === 'Maintenance' || newSt === 'En panne') ? date : '';
  db.trucks[idx].statusReason = (newSt === 'Maintenance' || newSt === 'En panne') ? reason : '';
  
  saveDB(db);
  
  // VERIFICATION
  var verify = loadDB();
  var vt = verify.trucks.find(function(x){return x.ref===ref;});
  if (!vt || vt.statut !== newSt) {
    alert('ERREUR: sauvegarde echouee!');
    return;
  }
  
  alert('✅ '+ref+' -> '+newSt+(newSt==='Actif'?' (remis en service)':''));
  switchTab('status');
}

function nextTicket(db, type) {
  var prefix = type === 'car' ? 'CAR' : type === 'filter' ? 'FLT' : 'HUI';
  var year = new Date().getFullYear();
  if (!db.ticketCounter) db.ticketCounter = {car:0, filter:0, oil:0};
  db.ticketCounter[type] = (db.ticketCounter[type] || 0) + 1;
  return prefix + '-' + year + '-' + String(db.ticketCounter[type]).padStart(4, '0');
}

  var db = loadDB();
  var entry = null;
  var truck = null;
  
  if (type === 'car') {
    entry = db.fuel.find(function(f){return f.ticketNo === ticketNo;});
    if (entry) truck = db.trucks.find(function(t){return t.ref === entry.truckRef;});

    entry = db.filterChanges.find(function(f){return f.ticketNo === ticketNo;});
    if (entry) truck = db.trucks.find(function(t){return t.ref === entry.truckRef;});

  if (!m.truckRef || !m.month) { alert('Camion et mois obligatoires!'); return; }
  db.mileage.push(m);
  saveDB(db);
  alert('✅ Kilometrage enregistre! Parcouru: '+((m.kmEnd-m.kmStart)).toLocaleString()+' km');
  switchTab('mileage');
}

// ============================================
// ALERTES
// ============================================
function renderAlerts() {
  var db = loadDB();
  var html = '<div class="card"><div class="card-header">⚠️ Alertes entretien preventif</div><div class="card-body">';
  html += '<div class="info-box">Alertes calculees a partir du dernier kilometrage connu et des seuils par camion. Critique = seuil depasse. Preventive = 80% atteint.</div>';
  
  var hasAlerts = false;
  db.trucks.forEach(function(t) {
    var currentKm = getLatestKm(t.ref);
    var lastOilKm = getKmAtLastOilChange(t.ref);
    var kmSinceOil = currentKm - lastOilKm;
    var seuil = t.seuilVidange || 30000;
    var pct = Math.min(Math.round(kmSinceOil / seuil * 100), 100);
    var color = pct >= 100 ? 'prog-red' : pct >= 80 ? 'prog-orange' : 'prog-green';
    
    var a = checkAlert(t);
    if (a) {
      hasAlerts = true;
      if (a.level === 'crit') {
        html += '<div class="alert-box"><b>🚨 '+t.ref+'</b> - '+t.brand+' '+t.model+' ('+(t.driver||'')+')<br><span style="color:var(--red);font-weight:600">'+a.msg+'</span><br><small>KM actuel: '+currentKm.toLocaleString()+' | Derniere vidange: '+lastOilKm.toLocaleString()+' | Depuis: '+kmSinceOil.toLocaleString()+' km</small><div class="prog-bar"><div class="prog-fill '+color+'" style="width:'+pct+'%"></div></div></div>';
      } else {
        html += '<div class="alert-warn"><b>⚠️ '+t.ref+'</b> - '+t.brand+' '+t.model+' ('+(t.driver||'')+')<br><span style="color:var(--orange);font-weight:600">'+a.msg+'</span><br><small>KM actuel: '+currentKm.toLocaleString()+' | Derniere vidange: '+lastOilKm.toLocaleString()+' | Depuis: '+kmSinceOil.toLocaleString()+' km</small><div class="prog-bar"><div class="prog-fill '+color+'" style="width:'+pct+'%"></div></div></div>';
      }
    }
  });
  if (!hasAlerts) html += '<div class="success-box">✅ Aucune alerte. Maintenances dans les seuils.</div>';
  html += '</div></div>';
  return html;
}

function generateReport() {
  var db = loadDB();
  var ref = val('reportTruck');
  var from = val('reportFrom');
  var to = val('reportTo');
  
  if (!ref) { alert('Choisir un camion!'); return; }
  if (!from || !to) { alert('Dates obligatoires!'); return; }
  
  var truck = db.trucks.find(function(t){return t.ref===ref;});
  if (!truck) { alert('Camion introuvable!'); return; }
  
  // Filter data within date range
  var filters = db.filterChanges.filter(function(f){return f.truckRef===ref && f.date>=from && f.date<=to;});
  var oils = db.oilChanges.filter(function(o){return o.truckRef===ref && o.date>=from && o.date<=to;});
  var fuels = db.fuel.filter(function(f){return f.truckRef===ref && f.date>=from && f.date<=to;});
  var kms = db.mileage.filter(function(m){return m.truckRef===ref && m.month>=from.slice(0,7) && m.month<=to.slice(0,7);});
  var statuses = db.statusHistory.filter(function(s){return s.truckRef===ref && s.date>=from && s.date<=to;});
  
  // Calculations
  var totalFilterCost = filters.reduce(function(s,f){return s+((f.qty||0)*(f.price||0));},0);
  var totalOilCost = oils.reduce(function(s,o){return s+((o.liters||0)*(o.pricePerL||0));},0);
  var totalOilLiters = oils.reduce(function(s,o){return s+(o.liters||0);},0);
  var totalFuelLiters = fuels.reduce(function(s,f){return s+(f.liters||0);},0);
  var totalFuelCost = fuels.reduce(function(s,f){return s+((f.liters||0)*(f.pricePerL||0));},0);
  var totalKm = kms.reduce(function(s,m){return s+((m.kmEnd||0)-(m.kmStart||0));},0);
  var totalConso = totalKm > 0 && totalFuelLiters > 0 ? (totalFuelLiters/totalKm*100).toFixed(2) : '-';
  var maintDays = statuses.filter(function(s){return s.newStatus==='Maintenance'||s.newStatus==='En panne';}).reduce(function(s,st){return s+(st.durationDays||0);},0);
  
  var html = '<div class="card"><div class="card-header">📋 Rapport: ' + ref + ' - ' + truck.brand + ' ' + truck.model + '</div><div class="card-body">';
  
  // Summary
  html += '<div class="info-box"><b>Periode:</b> ' + from + ' au ' + to + '<br><b>Chauffeur:</b> ' + (truck.driver||'') + ' | <b>Statut:</b> ' + truck.statut + '</div>';
  
  // Stats grid
  html += '<div class="stats">';
  html += '<div class="stat-card"><div class="label">KM parcourus</div><div class="value">'+totalKm.toLocaleString()+'</div></div>';
  html += '<div class="stat-card gold"><div class="label">Cout carburant</div><div class="value">'+totalFuelCost.toFixed(0)+'</div></div>';
  html += '<div class="stat-card gold"><div class="label">Cout filtres</div><div class="value">'+totalFilterCost.toFixed(0)+'</div></div>';
  html += '<div class="stat-card gold"><div class="label">Cout huile</div><div class="value">'+totalOilCost.toFixed(0)+'</div></div>';
  html += '<div class="stat-card"><div class="label">L carburant</div><div class="value">'+totalFuelLiters.toFixed(0)+'</div></div>';
  html += '<div class="stat-card"><div class="label">L huile</div><div class="value">'+totalOilLiters.toFixed(0)+'</div></div>';
  html += '<div class="stat-card"><div class="label">Conso L/100</div><div class="value">'+totalConso+'</div></div>';
  html += '<div class="stat-card orange"><div class="label">Jours immobilise</div><div class="value">'+maintDays+'</div></div>';
  html += '</div>';
  
  // Couts totaux
  var grandTotal = totalFilterCost + totalOilCost + totalFuelCost;
  html += '<div style="background:#FFF8E1;border:2px solid #FFD54F;border-radius:8px;padding:10px 14px;margin:10px 0;text-align:center;font-size:18px;font-weight:bold;color:#B89414">COUT TOTAL PERIODE: ' + grandTotal.toFixed(3) + ' TND</div>';
  
  // Filtres detail
  html += '<p style="font-weight:600;color:var(--navy);margin:14px 0 6px;border-bottom:2px solid var(--gold);padding-bottom:4px">🧰 CHANGEMENTS DE FILTRES (' + filters.length + ')</p>';
  if (filters.length === 0) { html += '<div class="empty">Aucun changement de filtre sur cette periode</div>'; }
  else {
    html += '<table><thead><tr><th>Ticket</th><th>Date</th><th>Type</th><th>Ref</th><th>Marque</th><th>Qte</th><th>Prix U.</th><th>Total</th><th>Fourn.</th></tr></thead><tbody>';
    filters.forEach(function(f) {
      html += '<tr><td>'+(f.ticketNo||'-')+'</td><td>'+f.date+'</td><td>'+f.filterType+'</td><td>'+(f.filterRef||'')+'</td><td>'+(f.filterBrand||'')+'</td><td>'+(f.qty||1)+'</td><td>'+(f.price||0).toFixed(3)+'</td><td><b>'+((f.qty||0)*(f.price||0)).toFixed(3)+'</b></td><td>'+(f.supplier||'')+'</td></tr>';
    });
    html += '<tr style="background:#FFF8E1;font-weight:bold"><td colspan="7">TOTAL FILTRES</td><td>'+totalFilterCost.toFixed(3)+' TND</td><td></td></tr>';
    html += '</tbody></table>';
  }
  
  // Huile detail
  html += '<p style="font-weight:600;color:var(--navy);margin:14px 0 6px;border-bottom:2px solid var(--gold);padding-bottom:4px">🛢️ VIDANGES (' + oils.length + ')</p>';
  if (oils.length === 0) { html += '<div class="empty">Aucune vidange sur cette periode</div>'; }
  else {
    html += '<table><thead><tr><th>Ticket</th><th>Date</th><th>KM</th><th>Type</th><th>Marque</th><th>L</th><th>Prix/L</th><th>Total</th><th>Fourn.</th></tr></thead><tbody>';
    oils.forEach(function(o) {
      html += '<tr><td>'+(o.ticketNo||'-')+'</td><td>'+o.date+'</td><td>'+(o.km||0).toLocaleString()+'</td><td>'+o.oilType+'</td><td>'+(o.oilBrand||'')+'</td><td>'+(o.liters||0)+'</td><td>'+(o.pricePerL||0).toFixed(3)+'</td><td><b>'+((o.liters||0)*(o.pricePerL||0)).toFixed(3)+'</b></td><td>'+(o.supplier||'')+'</td></tr>';
    });
    html += '<tr style="background:#FFF8E1;font-weight:bold"><td colspan="6">TOTAL HUILE ('+totalOilLiters+'L)</td><td></td><td>'+totalOilCost.toFixed(3)+' TND</td><td></td></tr>';
    html += '</tbody></table>';
  }
  
  // Carburant detail
  html += '<p style="font-weight:600;color:var(--navy);margin:14px 0 6px;border-bottom:2px solid var(--gold);padding-bottom:4px">⛽ CARBURANT (' + fuels.length + ' pleins)</p>';
  if (fuels.length === 0) { html += '<div class="empty">Aucun plein sur cette periode</div>'; }
  else {
    html += '<table><thead><tr><th>Ticket</th><th>Date</th><th>KM</th><th>Litres</th><th>Prix/L</th><th>Total</th><th>Station</th></tr></thead><tbody>';
    fuels.forEach(function(f) {
      html += '<tr><td>'+(f.ticketNo||'-')+'</td><td>'+f.date+'</td><td>'+(f.km||0).toLocaleString()+'</td><td>'+(f.liters||0)+'</td><td>'+(f.pricePerL||0).toFixed(3)+'</td><td><b>'+((f.liters||0)*(f.pricePerL||0)).toFixed(3)+'</b></td><td>'+(f.station||'')+'</td></tr>';
    });
    html += '<tr style="background:#FFF8E1;font-weight:bold"><td colspan="3">TOTAL ('+totalFuelLiters.toFixed(0)+'L)</td><td></td><td></td><td>'+totalFuelCost.toFixed(3)+' TND</td><td></td></tr>';
    html += '</tbody></table>';
  }
  
  // Kilometrage detail
  if (kms.length > 0) {
    html += '<p style="font-weight:600;color:var(--navy);margin:14px 0 6px;border-bottom:2px solid var(--gold);padding-bottom:4px">📏 KILOMETRAGE (' + kms.length + ' mois)</p>';
    html += '<table><thead><tr><th>Mois</th><th>KM debut</th><th>KM fin</th><th>Parcouru</th><th>Source</th></tr></thead><tbody>';
    kms.forEach(function(m) {
      html += '<tr><td>'+m.month+'</td><td>'+(m.kmStart||0).toLocaleString()+'</td><td>'+(m.kmEnd||0).toLocaleString()+'</td><td><b>'+((m.kmEnd||0)-(m.kmStart||0)).toLocaleString()+'</b></td><td>'+(m.source||'')+'</td></tr>';
    });
    html += '</tbody></table>';
  }
  
  // Status changes
  if (statuses.length > 0) {
    html += '<p style="font-weight:600;color:var(--navy);margin:14px 0 6px;border-bottom:2px solid var(--gold);padding-bottom:4px">🔧 CHANGEMENTS DE STATUT (' + statuses.length + ')</p>';
    html += '<table><thead><tr><th>Date</th><th>Ancien</th><th>Nouveau</th><th>Retour</th><th>Duree</th><th>Motif</th></tr></thead><tbody>';
    statuses.forEach(function(s) {
      html += '<tr><td>'+s.date+'</td><td>'+(s.oldStatus||'')+'</td><td>'+s.newStatus+'</td><td>'+(s.dateRetour||'-')+'</td><td>'+(s.durationDays?s.durationDays+' j':'-')+'</td><td>'+(s.reason||'')+'</td></tr>';
    });
    html += '</tbody></table>';
  }
  
  // Print button
  html += '<div class="action-btns" style="margin-top:14px"><button class="btn btn-gold" onclick="printReport()">🖨️ Imprimer le rapport</button></div>';
  html += '</div></div>';
  
  document.getElementById('reportResult').innerHTML = html;
}

function printReport() {
  var content = document.getElementById('reportResult').innerHTML;
  var w = window.open('', '_blank', 'width=800,height=600');
  var html = '<html><head><meta charset="UTF-8"><title>Rapport Flotte</title>';
  html += '<style>@media print{.no-print{display:none}}body{font-family:Segoe UI,sans-serif;font-size:12px;padding:20px;color:#333}table{width:100%;border-collapse:collapse;margin:8px 0}th{background:#0A1628;color:#fff;padding:6px;font-size:11px}td{padding:5px;border-bottom:1px solid #ddd;font-size:11px}.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.stat-card{border:1px solid #ddd;border-radius:6px;padding:8px;min-width:120px}.label{font-size:10px;color:#757575}.value{font-size:18px;font-weight:bold}.info-box{background:#E3F2FD;padding:8px;border-radius:6px;margin:8px 0}</style>';
  html += '</head><body>' + content + '<div class="no-print" style="text-align:center;margin-top:15px"><button onclick="window.print()" style="padding:10px 20px;font-size:14px;cursor:pointer;background:#0A1628;color:#fff;border:none;border-radius:4px">Imprimer</button></div></body></html>';
  w.document.write(html);
  w.document.close();
}

function exportCSV() {
  var db = loadDB();
  var csv = '';
  csv += 'PARC CAMIONS\nRef,Immat,Marque,Modele,Annee,CG,Chassis,Chauffeur,Convoyeur,DateMC,KMInit,SeuilV,SeuilA,SeuilH,Statut,DateStatut\n';
  db.trucks.forEach(function(t) {
    csv += [t.ref,t.immat,t.brand,t.model,t.year,t.cg,t.chassis,t.driver,t.convoyeur,t.dateMC,t.kmInit,t.seuilVidange,t.seuilAir,t.seuilHuile,t.statut,t.statusDate].map(function(x){return x||'';}).join(',')+'\n';
  });
  csv += '\n\nSTATUTS\nCamion,Ancien,Nouveau,Date,Retour,Duree,Motif\n';
  db.statusHistory.forEach(function(s) {
    csv += [s.truckRef,s.oldStatus,s.newStatus,s.date,s.dateRetour,s.durationDays,s.reason].map(function(x){return x||'';}).join(',')+'\n';
  });
  csv += '\n\nFILTRES\nTicket,Date,Camion,Type,Ref,Marque,Qte,Prix,Total,Fournisseur\n';
  db.filterChanges.forEach(function(f) {
    csv += [f.ticketNo||'',f.date,f.truckRef,f.filterType,f.filterRef,f.filterBrand,f.qty,f.price,((f.qty||0)*(f.price||0)).toFixed(3),f.supplier].map(function(x){return x||'';}).join(',')+'\n';
  });
  csv += '\n\nVIDANGES\nTicket,Date,Camion,KM,Type,Marque,Litres,Prix/L,Total,Fournisseur\n';
  db.oilChanges.forEach(function(o) {
    csv += [o.ticketNo||'',o.date,o.truckRef,o.km,o.oilType,o.oilBrand,o.liters,o.pricePerL,((o.liters||0)*(o.pricePerL||0)).toFixed(3),o.supplier].map(function(x){return x||'';}).join(',')+'\n';
  });
  csv += '\n\nCARBURANT\nTicket,Date,Camion,KM,Litres,Prix/L,Total,Type,Station\n';
  db.fuel.forEach(function(f) {
    csv += [f.ticketNo||'',f.date,f.truckRef,f.km,f.liters,f.pricePerL,(f.liters*f.pricePerL).toFixed(3),f.type,f.station].map(function(x){return x||'';}).join(',')+'\n';
  });
  csv += '\n\nKILOMETRAGE\nMois,Camion,KMDebut,KMFin,Parcouru,Source,Notes\n';
  db.mileage.forEach(function(m) {
    csv += [m.month,m.truckRef,m.kmStart,m.kmEnd,m.kmEnd-m.kmStart,m.source,m.notes].map(function(x){return x||'';}).join(',')+'\n';
  });
  var blob = new Blob(['\ufeff'+csv], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'flotte_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

function exportJSON() {
  var blob = new Blob([JSON.stringify(loadDB(), null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup_flotte_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importJSON(e) {
  var file = e.target.files[0];
  if (!file) return;
  var r = new FileReader();
  r.onload = function(ev) {
    try {
      var db = JSON.parse(ev.target.result);
      saveDB(db);
      alert('✅ Importe!');
      switchTab('dashboard');
    } catch(err) { alert('Erreur: fichier invalide'); }
  };
  r.readAsText(file);
}
